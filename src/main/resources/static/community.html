<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
	rel="stylesheet">

<title>Community</title>

<style>
body {
	background: #000;
	color: #fff;
	font-family: "Poppins", sans-serif;
}

.container-main {
	display: flex;
	min-height: 100vh;
}

/* Sidebar */
.sidebar {
	width: 260px;
	border-right: 1px solid #2f3336;
	padding: 2rem;
}

.sidebar ul {
	list-style: none;
	padding: 0;
}

.sidebar li {
	padding: 10px;
	cursor: pointer;
	border-radius: 20px;
}

.sidebar li:hover {
	background: #16181c;
	color: #1d9bf0;
}

/* Content */
.content {
	flex: 1;
	padding: 2rem;
}

/* Create Community Card */
.create-box {
	border: 1px solid #2f3336;
	padding: 20px;
	border-radius: 12px;
	margin-bottom: 30px;
}

.create-box input, .create-box textarea {
	width: 100%;
	background: transparent;
	border: 1px solid #2f3336;
	color: white;
	padding: 10px;
	border-radius: 8px;
	margin-bottom: 10px;
}

.create-btn {
	background: #1d9bf0;
	border: none;
	padding: 10px;
	border-radius: 25px;
	width: 150px;
	color: white;
}

/* Community Cards */
.community-grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
	gap: 20px;
}

.community-card {
	background: linear-gradient(145deg, #0f172a, #020617);
	border-radius: 18px;
	padding: 18px;
	border: 1px solid #1e293b;
	transition: 0.3s ease;
	position: relative;
	word-wrap: break-word;
}

.community-card:hover {
	transform: translateY(-6px);
	border-color: #3b82f6;
	box-shadow: 0 10px 40px rgba(59, 130, 246, 0.25);
}

.community-top {
	display: flex;
	align-items: center;
	gap: 12px;
}

.community-icon {
	width: 50px;
	height: 50px;
	border-radius: 50%;
	background: linear-gradient(135deg, #3b82f6, #06b6d4);
	display: flex;
	align-items: center;
	justify-content: center;
	font-weight: bold;
}

.community-name {
	font-weight: 600;
	font-size: 1.1rem;
}

.community-members {
	font-size: 0.8rem;
	color: #94a3b8;
}

.community-desc {
	margin: 12px 0;
	color: #cbd5f5;
}

.join-btn {
	border-radius: 20px;
	padding: 6px 12px;
	border: 1px solid #3b82f6;
	background: transparent;
	color: #3b82f6;
	font-size: 13px;
}

.join-btn.joined {
	background: #3b82f6;
	color: white;
}

.delete-btn {
	font-size: 13px;
	padding: 6px 12px;
	background: #ff4d4d;
	border: none;
	color: white;
	border-radius: 20px;
	margin-left: 10px;
}

/* 🔥 MOBILE FIX */
@media (max-width: 768px) {

    .container-main {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        display: flex;
        justify-content: space-around;
        border-right: none;
        border-bottom: 1px solid #2f3336;
        padding: 10px;
    }

    .sidebar ul {
        display: flex;
        width: 100%;
        justify-content: space-around;
    }

    .sidebar li {
        font-size: 0.9rem;
        padding: 6px;
    }

    .content {
        padding: 1rem;
    }

    .community-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container-main">

	<!-- Sidebar -->
	<div class="sidebar">
		<ul>
			<li onclick="window.location.href='dashboard.html'"><i class='bx bx-home'></i> Home</li>
			<li><i class='bx bx-group'></i> Communities</li>
			<li onclick="window.location.href='profile.html'"><i class='bx bx-user'></i> Profile</li>
		</ul>
	</div>

	<!-- Main Content -->
	<div class="content">

		<h2>Communities</h2>

		<!-- Create Community -->
		<div class="create-box">
			<h5>Create Community</h5>
			<input type="text" id="communityName" placeholder="Community Name">
			<textarea id="communityDesc" rows="2" placeholder="Description"></textarea>
			<button class="create-btn" onclick="createCommunity()">Create</button>
		</div>

		<!-- Community List -->
		<div class="community-grid" id="communityList"></div>

	</div>

</div>

<script>
const API = "http://localhost:8080/api";

async function loadCommunities() {

    const container = document.getElementById("communityList");
    container.innerHTML = "Loading...";

    const token = localStorage.getItem("token");
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));

    const [allRes, userRes] = await Promise.all([
        fetch(`${API}/communities/all`),
        fetch(`${API}/communities/user/${currentUser.id}`, {
            headers: { "Authorization": "Bearer " + token }
        })
    ]);

    const communities = await allRes.json();
    const memberships = await userRes.json();

    container.innerHTML = "";

    for (const c of communities) {

        const memberRes = await fetch(`${API}/communities/${c.id}/members/count`);
        const count = await memberRes.json();

        const membership = memberships.find(m => m.communityId === c.id);
        const joined = !!membership;
        const isCreator = c.createdBy === currentUser.id;

        const div = document.createElement("div");
        div.className = "community-card";

        div.innerHTML = `
            <div class="community-top">
                <div class="community-icon">${c.name.charAt(0)}</div>
                <div>
                    <div>${c.name}</div>
                    <small>${count} members</small>
                </div>
            </div>

            <p>${c.description || ""}</p>

            <div style="display:flex; gap:10px;">
                <button class="join-btn ${joined ? "joined" : ""}">
                    ${joined ? "Leave" : "Join"}
                </button>

                ${isCreator ? `<button class="delete-btn">Delete</button>` : ""}
            </div>
        `;

        const joinBtn = div.querySelector(".join-btn");
        joinBtn.onclick = async () => {

            const action = joined ? "leave" : "join";

            const res = await fetch(`${API}/communities/${c.id}/${action}`, {
                method: "POST",
                headers: { "Authorization": "Bearer " + token }
            });

            if (!res.ok) return alert("Failed");

            loadCommunities();
        };

        const deleteBtn = div.querySelector(".delete-btn");
        if (deleteBtn) {
            deleteBtn.onclick = async () => {

                if (!confirm("Delete this community?")) return;

                const res = await fetch(`${API}/communities/${c.id}`, {
                    method: "DELETE",
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!res.ok) {
                    const err = await res.text();
                    alert(err);
                    return;
                }

                loadCommunities();
            };
        }

        container.appendChild(div);
    }
}

loadCommunities();
</script>

<!-- 🔥 REQUIRED -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
